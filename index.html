<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Manage your tasks, achieve your goals.</p>
        <button id="addTaskBtn">+ Add Task</button>
    </header>
    <main>
        <section class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <span id="totalCount">0</span>
            </div>
            <div class="card">
                <h3>Pending Tasks</h3>
                <span id="pendingCount">0</span>
            </div>
            <div class="card">
                <h3>Completed Tasks</h3>
                <span id="completedCount">0</span>
            </div>
            <div class="card">
                <h3>Overdue Tasks</h3>
                <span id="overdueCount">0</span>
            </div>
        </section>
        <section class="controls">
            <input type="search" id="searchInput" placeholder="Search tasks by title...">

            <select id="statusFilter">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
            </select>
            <select id="priorityFilter">
                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <select id="deadlineFilter">
                <option value="all">All Deadlines</option>
                <option value="today">Due Today</option>
                <option value="week">Due This Week</option>
                <option value="overdue">Overdue</option>
            </select>
            <select id="sortSelect">
                <option value="dueDate">Due Date</option>
                <option value="priority">Priority</option>
                <option value="status">Completion Status</option>
            </select>

            <button id="clearFiltersBtn">Clear Filters</button>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
